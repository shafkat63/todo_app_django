{% extends 'todo_app/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
    <h2>Delete Task</h2>
    
    <div>
        <p>Are you sure you want to delete the task "{{ todo.title }}"?</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'todo_list' %}" class="btn btn-primary">Cancel</a>
    </form>
{% endblock %}
