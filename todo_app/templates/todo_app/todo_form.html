{% extends 'todo_app/base.html' %}

{% block title %}
    {% if form.instance.pk %}Edit Task{% else %}New Task{% endif %}
{% endblock %}

{% block content %}
    <h2 class="mb-4 text-center">{% if form.instance.pk %}Edit Task{% else %}New Task{% endif %}</h2>
    
    <div class="card p-4 shadow-sm">
        <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.title.id_for_label }}" class="form-label">Title</label>
                <input type="text" name="{{ form.title.name }}" value="" class="form-control" id="{{ form.title.id_for_label }}">
            </div>

            <div class="mb-3">
                <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
                <textarea name="{{ form.description.name }}" class="form-control" id="{{ form.description.id_for_label }}"></textarea>
            </div>

            <div class="form-check mb-3">
                {{ form.completed }}
                <label for="{{ form.completed.id_for_label }}" class="form-check-label">Completed</label>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'todo_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
