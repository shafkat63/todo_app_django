<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Todo App{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        .todo-item {
            border-left: 5px solid #0d6efd;
            background-color: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .todo-item.completed {
            border-left-color: #198754;
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'todo_list' %}">Todo App</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'todo_list' %}">Todo List</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'todo_create' %}">Add New Task</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                        </li>
                        
                    </ul>
                </div>
            </div>
        </nav>

        <header class="mb-4 text-center">
            <h3 class="mb-4 text-primary font-weight-bold display-4">
                Django Todo App
            </h3>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="text-center mt-5 text-muted small">
            &copy; {{ current_year|default:2025 }} Todo App. Built by Shafkat.
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
